<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator — Random Imgflip Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 2rem 1rem;
        }

        .meme-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            max-width: 540px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .memeDiv {
            width: 100%;
            margin-top: 1.5rem;
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px dashed #334155;
            padding: 1rem;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: contain;
            max-height: 450px;
        }

        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
        }

        .form-control:focus {
            background-color: #0f172a;
            border-color: #38bdf8;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }

        .btn-custom {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-custom:hover {
            background-color: #0284c7;
            color: #ffffff;
        }
    </style>
</head>

<body>
    <div class="meme-card text-center">
        <h2 class="h4 mb-2 fw-bold text-info">Meme Generator</h2>
        <p class="text-secondary small mb-4">Explore top 100 trending memes via Imgflip REST API</p>

        <div class="input-group mb-3">
            <input type="number" min="0" max="99" class="form-control belInpute text-center" placeholder="Enter meme index (0 - 99)" value="0">
            <button class="btn btn-custom px-4" type="button" id="showBtn">Load Meme</button>
        </div>

        <div class="memeDiv text-secondary" id="memeContainer">
            <span>Enter a number between 0 and 99 and click <strong>Load Meme</strong></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="memes.js"></script>
</body>

</html>
