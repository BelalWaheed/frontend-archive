<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter — Live Foreign Exchange Rates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Currency_converter.css">
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100 p-3">
    <div class="converter-card shadow-lg">
        <div class="card-header text-center text-white p-4">
            <h2 class="h3 mb-0 fw-bold">Live Currency Converter</h2>
            <p class="text-white-50 small mb-0 mt-1">Real-time exchange rate calculations with dynamic country flags</p>
        </div>
        <div class="card-body p-4 p-md-5">
            <div class="mb-4">
                <div class="input-group">
                    <div class="form-floating flex-grow-1">
                        <input type="number" step="any" min="0" class="form-control belInpuit" id="amountInput" placeholder="1" value="1">
                        <label for="amountInput">Amount to Convert</label>
                    </div>
                    <button class="btn btn-outline-secondary swap px-3" type="button" title="Swap currencies">
                        &#8646;
                    </button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="form-floating">
                        <select class="form-select form_select from" id="fromCurrency" aria-label="Source currency"></select>
                        <label class="label_from" for="fromCurrency">
                            <img src="https://flagsapi.com/US/shiny/64.png" alt="From Flag" style="width: 24px; vertical-align: middle;">
                            From
                        </label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <select class="form-select form_select to" id="toCurrency" aria-label="Target currency"></select>
                        <label class="label_to" for="toCurrency">
                            <img src="https://flagsapi.com/EG/shiny/64.png" alt="To Flag" style="width: 24px; vertical-align: middle;">
                            To
                        </label>
                    </div>
                </div>
            </div>

            <div class="text-center mb-4">
                <button class="btn btn-primary btn-lg px-5 fw-semibold convertBtn" type="button">Convert Currency</button>
            </div>

            <div class="result p-3 text-center rounded-3">
                <h4 class="mb-0 fw-bold fs-5">Select currencies and click Convert</h4>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Currency_convertor.js"></script>
</body>

</html>
