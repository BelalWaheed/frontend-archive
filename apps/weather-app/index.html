<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard — Real-Time Forecasts & Atmospheric Metrics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="WeatherAPP.css">
</head>

<body class="page_ d-flex justify-content-center align-items-center min-vh-100 p-3">
    <div class="card_Holder container d-flex flex-column p-4 p-md-5 rounded-4 shadow-lg">
        <!-- Header / Location & Time -->
        <div class="head1 text-center text-white mb-3">
            <h2 class="h3 fw-bold text-info">Weather Dashboard</h2>
            <p class="text-white-50 small mb-0">Search worldwide cities for live atmospheric metrics & local time</p>
        </div>

        <!-- Search Section -->
        <div class="input-group input-group-lg mb-4">
            <input class="form-control" type="text" id="cityInput" placeholder="Enter city name (e.g. Cairo, London, Tokyo)" aria-label="City name" value="Cairo">
            <button type="button" class="btn btn-info px-4 fw-semibold" id="searchBtn">Search</button>
        </div>

        <!-- Weather Primary Data -->
        <div class="tempreture text-center mb-4"></div>

        <!-- Additional Metrics -->
        <div class="addInfo text-warning text-center"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="weather.js"></script>
</body>

</html>
