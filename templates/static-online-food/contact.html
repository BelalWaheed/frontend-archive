<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Order — FreshBite Organic Food Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top py-3 border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold text-success fs-4" href="index.html">FreshBite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Menu & Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact & Order</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Form -->
    <main class="py-5">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card bg-secondary bg-opacity-25 border-0 p-4 p-md-5 rounded-4 shadow-lg">
                        <h1 class="h2 fw-bold text-success mb-2 text-center">Get in Touch with FreshBite</h1>
                        <p class="text-secondary text-center mb-4">Have questions about catering, corporate lunch subscriptions, or custom dietary boxes?</p>
                        
                        <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been received.');">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control bg-dark text-light border-secondary" id="fullName" placeholder="Your Name" required>
                                        <label for="fullName" class="text-secondary">Full Name</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="email" class="form-control bg-dark text-light border-secondary" id="emailAddr" placeholder="Email" required>
                                        <label for="emailAddr" class="text-secondary">Email Address</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <textarea class="form-control bg-dark text-light border-secondary" placeholder="Message" id="msgContent" style="height: 120px" required></textarea>
                                        <label for="msgContent" class="text-secondary">Your Message or Order Inquiry</label>
                                    </div>
                                </div>
                                <div class="col-12 text-center mt-4">
                                    <button type="submit" class="btn btn-success btn-lg px-5 fw-semibold">Send Message</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 bg-black text-center text-secondary border-top border-secondary small">
        <div class="container">
            <p class="mb-0">&copy; 2026 FreshBite Organic Delivery. Multi-Page Frontend Architecture Template.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
