<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Style/all.min.css">
    <link rel="stylesheet" href="../Style/bootstrap.min.css">
    <title>+ & -</title>

</head>

<body>
    <div class="calc d-flex justify-content-center " style="margin-top:5em ;">
        <div class="contanier p-2 bg-dark-subtle ">
            <input type="text" class="border border-success p-2 border-opacity-10 fs-2" style="direction: rtl;">

            <div class="p-2">
                <button onclick="display('1')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">1</button>
                <button onclick="display('2')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">2</button>
                <button onclick="display('3')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">3</button>
                <button onclick="display('+')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">+</button>
            </div>
            <div class="p-2">
                <button onclick="display('4')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">4</button>
                <button onclick="display('5')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">5</button>
                <button onclick="display('6')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">6</button>
                <button onclick="display('-')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">-</button>
            </div>
            <div class="p-2">
                <button onclick="display('7')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">7</button>
                <button onclick="display('8')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">8</button>
                <button onclick="display('9')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">9</button>
                <button onclick="display('*')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">*</button>
            </div>
            <div class="p-2">
                <button onclick="display('0')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">0</button>
                <button onclick="belclear()" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 25px;">Del</button>
                <button onclick="display('/')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">/</button>
                <button onclick="display('=')" type="button" class="btn btn-primary btn-lg"
                    style="padding: 30px 35px;">=</button>
            </div>
        </div>
    </div>
    <script src="/Lec-5-3/index.js"></script>
    <script src="/Script/bootstrap.bundle.min.js"></script>
</body>

</html>
