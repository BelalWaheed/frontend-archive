<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Style/all.min.css">
    <link rel="stylesheet" href="/Style/bootstrap.min.css">
    <title>+ & -</title>
    <style>
        .btn {
            padding: 30px 35px;
        }

        .belDel {
            padding: 30px 35px;
            background-color: black;
            color: blanchedalmond;
        }

        .belEq {
            padding: 30px 35px;
            background-color: black;
            color: blanchedalmond;
        }

        .remo {
            padding: 30px 35px;
            background-color: black;
            color: blanchedalmond;
        }
    </style>
</head>

<body>
    <div class="calc d-flex justify-content-center " style="margin-top:5em ;">
        <div class="contanier p-2 bg-dark-subtle ">
            <input type="text" class="border border-success p-2 border-opacity-10 fs-2">

            <div class="p-2">
                <button type="button" class="btn btn-primary btn-lg">1</button>
                <button type="button" class="btn btn-primary btn-lg">2</button>
                <button type="button" class="btn btn-primary btn-lg">3</button>
                <button type="button" class="btn btn-primary btn-lg">+</button>
            </div>
            <div class="p-2">
                <button type="button" class="btn btn-primary btn-lg">4</button>
                <button type="button" class="btn btn-primary btn-lg">5</button>
                <button type="button" class="btn btn-primary btn-lg">6</button>
                <button type="button" class="btn btn-primary btn-lg">-</button>
            </div>
            <div class="p-2">
                <button type="button" class="btn btn-primary btn-lg">7</button>
                <button type="button" class="btn btn-primary btn-lg">8</button>
                <button type="button" class="btn btn-primary btn-lg">9</button>
                <button type="button" class="btn btn-primary btn-lg">*</button>
            </div>
            <div class="p-2">
                <button type="button" class="btn btn-primary btn-lg">0</button>
                <button type="button" class="belDel  btn-primary btn-lg">Del</button>
                <button type="button" class="btn btn-primary btn-lg">/</button>
                <button type="button" class="belEq btn-primary btn-lg">=</button>
            </div>
            <div class="p-2">
                <button type="button" class="remo btn-primary btn-lg">C</button>
            </div>
        </div>
    </div>
    <script src="../Script/bootstrap.bundle.min.js"></script>
    <script src="cal.js"></script>
</body>

</html>
