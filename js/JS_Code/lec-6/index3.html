<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Style/all.min.css">
    <link rel="stylesheet" href="../Style/bootstrap.min.css">
    <title>Calc-v2-bel</title>
    <style>
        .btn {
            padding: 30px 35px;
        }
    </style>
</head>

<body>
    <div class="calc d-flex justify-content-center " style="margin-top:5em ;">
        <div class="contanier p-2 bg-dark-subtle ">
            <input type="text" class="border border-success p-2 border-opacity-10 fs-2" style="direction: rtl;">

            <div class="p-2">
                <button id="1" type="button" class="btn btn-primary btn-lg">1</button>
                <button id="2" type="button" class="btn btn-primary btn-lg">2</button>
                <button id="3" type="button" class="btn btn-primary btn-lg">3</button>
                <button id="+" type="button" class="btn btn-primary btn-lg">+</button>
            </div>
            <div class="p-2">
                <button id="4" type="button" class="btn btn-primary btn-lg">4</button>
                <button id="5" type="button" class="btn btn-primary btn-lg">5</button>
                <button id="6" type="button" class="btn btn-primary btn-lg">6</button>
                <button id="-" type="button" class="btn btn-primary btn-lg">-</button>
            </div>
            <div class="p-2">
                <button id="7" type="button" class="btn btn-primary btn-lg">7</button>
                <button id="8" type="button" class="btn btn-primary btn-lg">8</button>
                <button id="9" type="button" class="btn btn-primary btn-lg">9</button>
                <button id="*" type="button" class="btn btn-primary btn-lg">*</button>
            </div>
            <div class="p-2">
                <button id="0" type="button" class="btn btn-primary btn-lg">0</button>
                <button id="del" type="button" class="btn btn-primary btn-lg" style="padding: 30px 25px;">Del</button>
                <button id="/" type="button" class="btn btn-primary btn-lg">/</button>
                <button id="=" type="button" class="btn btn-primary btn-lg">=</button>
            </div>
        </div>
    </div>
    <script src="../Script/bootstrap.bundle.min.js"></script>
    <script src="index3.js"></script>
</body>

</html>
