<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="/TRYS/try_3.css">
    <link rel="icon" href="/Image/profile.png">
</head>

<body>
    <header>How much do You love Bale</header>
    <form action="">
        <div class="fc">
            <label for="Name">
                Name
            </label>
            <input type="text" name="Name" id="Name" placeholder="Enter Your Name" required>
        </div>

        <div class="fc">
            <label for="Email">
                Email
            </label>
            <input type="email" name="Email" id="Email" placeholder="Enter Your Email" readonly
                value="Bale3mk@belal.com">
        </div>

        <div class="fc">
            <label for="Age">
                Age
            </label>
            <input type="number" name="Age" id="Age" placeholder="Enter Your Age" min="1" max="150">

        </div>
        <div class="fc">
            <label for="sa">
                who do you like the most
            </label>
            <select name="" id="sa">
                <option value="">Bale</option>
                <option value="">or</option>
                <option value="">Bale</option>
                <option value="">or</option>
                <option value="">Bale</option>
            </select>
        </div>

        <div class="fc">
            <label for="">I dare You to click No</label>


            <label for="r1">
                <input type="radio" name="recommend" id="r1">is Bale3mk
            </label>

            <label for="r2">
                <input type="radio" name="recommend" id="r2" disabled>No
            </label>

            <label for="r3">
                <input type="radio" name="recommend" id="r3">Bale3mk
            </label>

        </div>

        <div class="fc">
            <label for="">
                Languages and Frameworks known (Check all that apply)
            </label>

            <label for="er1">
                <input type="checkbox" name="bal" id="er1">C
            </label>

            <label for="er2">
                <input type="checkbox" name="bal" id="er2">C++
            </label>

            <label for="er3">
                <input type="checkbox" name="bal" id="er3">C#
            </label>

            <label for="er4">
                <input type="checkbox" name="bal" id="er4">Physon
            </label>

            <label for="er5">
                <input type="checkbox" name="bal" id="er5">JavaScript
            </label>


            <label for="aas">
                <h4>Any comments or suggestions</h4>
            </label>

            <textarea name="comment" id="aas" placeholder="Enter your comment here"></textarea>

        </div>
        <button type="submit" value="submit">
            submit
        </button>
    </form>
</body>

</html>
